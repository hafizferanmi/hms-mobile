<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --coral:#E85D4E; --coral-soft:#FDECE9;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
  --slate:#5B6180; --slate-soft:#EEF0F7;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);}
.navbar{height:64px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;box-sizing:border-box;flex-shrink:0;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:Inter,sans-serif;font-weight:600;font-size:10.5px;color:var(--text-faint);}
.navitem.active{color:var(--navy);}
.dcell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
.rowlabel{width:50px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;font-weight:700;font-size:13px;color:var(--text);border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
input::placeholder{color:var(--text-faint);}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="padding:52px 16px 10px 16px;box-sizing:border-box;display:flex;align-items:center;gap:8px;flex-shrink:0;">
    <div style="flex-grow:1;position:relative;display:flex;align-items:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:11px;"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input placeholder="Search Name, Email, Res ID" style="width:100%;height:38px;box-sizing:border-box;padding:0 10px 0 32px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-family:Inter,sans-serif;font-size:13px;color:var(--text);">
    </div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </div>

  <div style="display:flex;align-items:stretch;padding:6px 16px 10px 16px;gap:6px;flex-shrink:0;">
    <div style="width:50px;flex-shrink:0;background:var(--navy);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:10px;color:#FFFFFF;margin-top:2px;">20 Sep</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;">
      <span style="font-family:Inter,sans-serif;font-weight:600;font-size:10.5px;color:var(--text-muted);">Sun</span>
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:12.5px;color:var(--text);">20</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;">
      <span style="font-family:Inter,sans-serif;font-weight:600;font-size:10.5px;color:var(--text-muted);">Mon</span>
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:12.5px;color:var(--text);">21</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--navy-soft);border-radius:9px;padding:3px 0;">
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:10.5px;color:var(--navy);">Today</span>
      <span style="font-family:Inter,sans-serif;font-weight:800;font-size:12.5px;color:var(--navy);">22</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;">
      <span style="font-family:Inter,sans-serif;font-weight:600;font-size:10.5px;color:var(--text-muted);">Wed</span>
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:12.5px;color:var(--text);">23</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;">
      <span style="font-family:Inter,sans-serif;font-weight:600;font-size:10.5px;color:var(--text-muted);">Thu</span>
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:12.5px;color:var(--text);">24</span>
    </div>
  </div>

  <div style="flex-grow:1;overflow-y:auto;border-top:1px solid var(--border);">

    <div style="display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--coral-soft);">
      <span style="width:3px;height:12px;border-radius:2px;background:var(--coral);"></span>
      <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:12.5px;color:var(--coral);">CD</span>
    </div>
    <div style="display:flex;">
      <div class="rowlabel" style="height:52px;">120</div>
      <div class="dcell" style="flex:1;height:52px;background:var(--slate-soft);"><svg width="12" height="3" viewBox="0 0 12 3"><rect width="12" height="3" rx="1.5" fill="var(--slate)"/></svg></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;background:var(--slate-soft);"><svg width="12" height="3" viewBox="0 0 12 3"><rect width="12" height="3" rx="1.5" fill="var(--slate)"/></svg></div>
      <div class="dcell" style="flex:1;height:52px;background:var(--slate-soft);"><svg width="12" height="3" viewBox="0 0 12 3"><rect width="12" height="3" rx="1.5" fill="var(--slate)"/></svg></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
    </div>
    <div style="display:flex;">
      <div class="rowlabel" style="height:52px;">121</div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
    </div>
    <div style="display:flex;">
      <div class="rowlabel" style="height:52px;">122</div>
      <div class="dcell" style="flex:1;height:52px;background:var(--slate-soft);"><svg width="12" height="3" viewBox="0 0 12 3"><rect width="12" height="3" rx="1.5" fill="var(--slate)"/></svg></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;background:var(--slate-soft);"><svg width="12" height="3" viewBox="0 0 12 3"><rect width="12" height="3" rx="1.5" fill="var(--slate)"/></svg></div>
      <div class="dcell" style="flex:1;height:52px;background:var(--slate-soft);"><svg width="12" height="3" viewBox="0 0 12 3"><rect width="12" height="3" rx="1.5" fill="var(--slate)"/></svg></div>
      <div class="dcell" style="flex:1;height:52px;background:var(--slate-soft);"><svg width="12" height="3" viewBox="0 0 12 3"><rect width="12" height="3" rx="1.5" fill="var(--slate)"/></svg></div>
    </div>

    <div style="display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--navy-soft);">
      <span style="width:3px;height:12px;border-radius:2px;background:var(--navy);"></span>
      <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:12.5px;color:var(--navy);">JD</span>
    </div>
    <div style="display:flex;">
      <div class="rowlabel" style="height:60px;">101</div>
      <div style="flex:1;height:60px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--coral-soft);border-left:3px solid var(--coral);box-sizing:border-box;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;">
        <span style="font-family:Inter,sans-serif;font-weight:700;font-size:12px;color:var(--navy-ink);">lawal baki</span>
        <div style="display:flex;align-items:center;gap:4px;">
          <span style="font-family:Inter,sans-serif;font-size:10.5px;color:var(--text-muted);">Walk-in</span>
          <span style="width:14px;height:14px;border-radius:4px;background:var(--coral);display:inline-flex;align-items:center;justify-content:center;"><svg width="8" height="8" viewBox="0 0 24 24" fill="#FFFFFF"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></span>
        </div>
      </div>
      <div class="dcell" style="flex:1;height:60px;"></div>
      <div class="dcell" style="flex:1;height:60px;"></div>
      <div class="dcell" style="flex:1;height:60px;"></div>
      <div class="dcell" style="flex:1;height:60px;"></div>
    </div>
    <div style="display:flex;">
      <div class="rowlabel" style="height:52px;">102</div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
    </div>
    <div style="display:flex;">
      <div class="rowlabel" style="height:52px;">103</div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
    </div>
    <div style="display:flex;">
      <div class="rowlabel" style="height:52px;">104</div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
      <div class="dcell" style="flex:1;height:52px;"></div>
    </div>

  </div>

  <div style="position:absolute;right:18px;bottom:84px;width:52px;height:52px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 18px rgba(30,42,94,0.35);">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <div class="navbar">
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-4h5v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9"/></svg><span>Home</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 4V6a1 1 0 0 1 1-1z"/></svg><span>Inbox</span></div>
    <div class="navitem active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg><span>Calendar</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg><span>Statistics</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></div>
  </div>

</div>
</body>
</html>
