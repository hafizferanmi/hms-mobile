<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --coral:#E85D4E; --coral-soft:#FDECE9;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
  --success:#1E9E6B; --success-soft:#E4F8EF;
  --amber:#C97F04; --amber-soft:#FBF0D9;
  --purple:#7C5CD6; --purple-soft:#F1ECFB;
  --slate:#5B6180; --slate-soft:#EEF0F7;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);}
.navbar{height:64px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;box-sizing:border-box;flex-shrink:0;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:Inter,sans-serif;font-weight:600;font-size:10.5px;color:var(--text-faint);}
.navitem.active{color:var(--navy);}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;width:72px;}
.qa-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
.qa-label{font-family:Inter,sans-serif;font-weight:600;font-size:11.5px;color:var(--text);text-align:center;}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow:hidden;display:flex;flex-direction:column;">

    <div style="background:linear-gradient(135deg,#3E52A3 0%, var(--navy) 100%);border-radius:0 0 32px 32px;padding:56px 24px 36px 24px;box-sizing:border-box;position:relative;overflow:hidden;flex-shrink:0;">
      <svg width="180" height="180" viewBox="0 0 180 180" style="position:absolute;top:-60px;right:-50px;opacity:0.25;"><circle cx="90" cy="90" r="90" fill="#5A6BC0"></circle></svg>

      <div style="display:flex;align-items:center;justify-content:space-between;position:relative;">
        <div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);border-radius:20px;padding:7px 12px;">
          <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;color:#FFFFFF;">Nutsh</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div style="display:flex;gap:10px;">
          <div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          </div>
          <div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:26px;position:relative;">
        <span style="font-family:Inter,sans-serif;font-weight:500;font-size:13px;color:#C4CBEE;">Today's Revenue</span>
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:38px;color:#FFFFFF;letter-spacing:-0.5px;">$200.00</span>
        <div style="display:flex;gap:5px;margin-top:6px;">
          <span style="width:16px;height:5px;border-radius:3px;background:#FFFFFF;"></span>
          <span style="width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,0.35);"></span>
        </div>
      </div>
    </div>

    <div style="flex-grow:1;overflow-y:auto;padding:0 20px 20px 20px;box-sizing:border-box;">

      <div style="background:var(--surface);border-radius:18px;margin-top:-22px;box-shadow:0 8px 20px rgba(18,23,58,0.07);display:flex;padding:18px 8px;position:relative;z-index:1;">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
          <span style="font-family:Inter,sans-serif;font-size:12px;color:var(--text-muted);">Arriving</span>
          <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;color:var(--amber);">0</span>
        </div>
        <div style="width:1px;background:var(--border);"></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
          <span style="font-family:Inter,sans-serif;font-size:12px;color:var(--text-muted);">Departing</span>
          <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;color:var(--slate);">0</span>
        </div>
        <div style="width:1px;background:var(--border);"></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
          <span style="font-family:Inter,sans-serif;font-size:12px;color:var(--text-muted);">New</span>
          <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;color:var(--coral);">0</span>
        </div>
      </div>

      <div style="margin-top:22px;">
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;color:var(--navy-ink);">Quick actions</span>
        <div style="background:var(--surface);border-radius:18px;margin-top:12px;padding:20px 8px;display:flex;justify-content:space-between;">
          <div class="qa-tile">
            <div class="qa-icon" style="background:var(--slate-soft);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
            </div>
            <span class="qa-label">More</span>
          </div>
          <div class="qa-tile">
            <div class="qa-icon" style="background:var(--purple-soft);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
            </div>
            <span class="qa-label">Reservations</span>
          </div>
          <div class="qa-tile">
            <div class="qa-icon" style="background:var(--amber-soft);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 14 10"/><path d="M13 5l6 6-2 2-6-6z"/></svg>
            </div>
            <span class="qa-label">Housekeeping</span>
          </div>
          <div class="qa-tile">
            <div class="qa-icon" style="background:var(--coral-soft);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9"/><path d="M12 19V4"/><path d="M20 19v-7"/></svg>
            </div>
            <span class="qa-label">Reports</span>
          </div>
        </div>
      </div>

      <div style="margin-top:18px;background:linear-gradient(120deg, var(--navy) 0%, #3B2E6E 100%);border-radius:18px;padding:20px;box-sizing:border-box;position:relative;overflow:hidden;">
        <svg width="90" height="90" viewBox="0 0 90 90" style="position:absolute;bottom:-30px;right:-20px;opacity:0.3;"><circle cx="45" cy="45" r="45" fill="#5A4E9A"></circle></svg>
        <div style="display:inline-flex;align-items:center;gap:5px;background:rgba(232,93,78,0.25);border-radius:20px;padding:4px 10px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#F0B429"><path d="M12 2l2.5 7.5H22l-6 4.5 2.5 7.5-6.5-4.5L5.5 21.5 8 14 2 9.5h7.5z"/></svg>
          <span style="font-family:Inter,sans-serif;font-weight:700;font-size:10.5px;color:#FFD9CF;">NEW</span>
        </div>
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;color:#FFFFFF;margin-top:10px;">PMS AI Assistant</div>
        <div style="font-family:Inter,sans-serif;font-size:13px;color:#C4CBEE;margin-top:4px;line-height:1.5;max-width:240px;position:relative;">Manage tasks with natural language — queries, operations and analytics.</div>
        <div style="margin-top:14px;background:rgba(255,255,255,0.14);display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 14px;">
          <span style="font-family:Inter,sans-serif;font-weight:600;font-size:12.5px;color:#FFFFFF;">Try it now</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>

    </div>
  </div>

  <div class="navbar">
    <div class="navitem active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-4h5v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9"/></svg><span>Home</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 4V6a1 1 0 0 1 1-1z"/></svg><span>Inbox</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg><span>Calendar</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg><span>Statistics</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></div>
  </div>

</div>
</body>
</html>
