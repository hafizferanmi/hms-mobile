<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log In</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
body{margin:0;font-family:Inter,sans-serif;background:#F5F6FB}
a{color:#E85D4E;text-decoration:none}
a:hover{color:#C7442F}
input::placeholder{color:#A4A9C1}
input:focus{outline:none;border-color:#1E2A5E;box-shadow:0 0 0 3px #EEF0FA}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F6FB;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="height:264px;flex-shrink:0;background:#1E2A5E;border-radius:0 0 36px 36px;box-sizing:border-box;padding:52px 28px 0 28px;display:flex;flex-direction:column;gap:28px;position:relative;overflow:hidden;">

    <svg width="140" height="140" viewBox="0 0 140 140" style="position:absolute;top:-46px;right:-46px;opacity:0.5;"><circle cx="70" cy="70" r="70" fill="#2B3A78"></circle></svg>
    <svg width="90" height="90" viewBox="0 0 90 90" style="position:absolute;top:150px;right:-20px;opacity:0.35;"><circle cx="45" cy="45" r="45" fill="#2B3A78"></circle></svg>

    <div style="display:flex;align-items:center;gap:8px;position:relative;">
      <svg width="22" height="17" viewBox="0 0 22 17" style="display:block;">
        <rect x="0" y="7" width="5" height="10" rx="1" fill="#E85D4E"></rect>
        <rect x="8.5" y="2" width="5" height="15" rx="1" fill="#F0B429"></rect>
        <rect x="17" y="9" width="5" height="8" rx="1" fill="#7C93FF"></rect>
      </svg>
      <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;color:#FFFFFF;letter-spacing:-0.3px;">iSuites</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;position:relative;">
      <h1 style="margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:28px;color:#FFFFFF;letter-spacing:-0.3px;">Welcome back</h1>
      <div style="font-family:Inter,sans-serif;font-size:14px;color:#B9C0E8;line-height:1.5;">Sign in to manage your property</div>
    </div>
  </div>

  <div style="flex-grow:1;background:#FFFFFF;border-radius:28px 28px 0 0;margin-top:-24px;box-shadow:0 -8px 24px rgba(18,23,58,0.06);box-sizing:border-box;padding:36px 28px 28px 28px;display:flex;flex-direction:column;position:relative;z-index:1;">

    <form style="display:flex;flex-direction:column;gap:16px;">

      <div style="display:flex;flex-direction:column;gap:6px;">
        <label for="email" style="font-family:Inter,sans-serif;font-weight:600;font-size:13px;color:#1A1D29;">Email</label>
        <div style="position:relative;display:flex;align-items:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A4A9C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;pointer-events:none;">
            <path d="M4 4h16v16H4z" opacity="0"></path>
            <path d="M3 6.5 12 13l9-6.5"></path>
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          </svg>
          <input id="email" type="email" placeholder="you@yourhotel.com" style="width:100%;height:50px;box-sizing:border-box;padding:0 14px 0 42px;border:1px solid #E7E9F3;border-radius:11px;background:#FFFFFF;font-family:Inter,sans-serif;font-size:15px;color:#1A1D29;">
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;">
        <label for="password" style="font-family:Inter,sans-serif;font-weight:600;font-size:13px;color:#1A1D29;">Password</label>
        <div style="position:relative;display:flex;align-items:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A4A9C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;pointer-events:none;">
            <rect x="5" y="11" width="14" height="9" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
          </svg>
          <input id="password" type="password" placeholder="••••••••" style="width:100%;height:50px;box-sizing:border-box;padding:0 42px 0 42px;border:1px solid #E7E9F3;border-radius:11px;background:#FFFFFF;font-family:Inter,sans-serif;font-size:15px;color:#1A1D29;">
          <button type="button" aria-label="Show password" style="position:absolute;right:10px;width:28px;height:28px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A4A9C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:2px;">
        <label style="display:flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-size:13px;color:#767C99;">
          <input type="checkbox" style="width:16px;height:16px;accent-color:#1E2A5E;margin:0;">
          Remember me
        </label>
        <a href="#" style="font-family:Inter,sans-serif;font-weight:600;font-size:13px;">Forgot password?</a>
      </div>

      <button type="submit" style="height:50px;margin-top:8px;border:none;border-radius:11px;background:#1E2A5E;color:#FFFFFF;font-family:Inter,sans-serif;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 16px rgba(30,42,94,0.24);">Log In</button>

      <div style="display:flex;align-items:center;gap:12px;margin-top:4px;">
        <div style="flex-grow:1;height:1px;background:#E7E9F3;"></div>
        <span style="font-family:Inter,sans-serif;font-size:12px;color:#A4A9C1;">or continue with</span>
        <div style="flex-grow:1;height:1px;background:#E7E9F3;"></div>
      </div>

      <button type="button" style="height:50px;border:1px solid #E7E9F3;border-radius:11px;background:#FFFFFF;color:#1A1D29;font-family:Inter,sans-serif;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.4-1.7 4.2-5.5 4.2-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.6C16.9 3.4 14.7 2.4 12 2.4 6.9 2.4 2.7 6.6 2.7 11.7S6.9 21 12 21c6.9 0 9.6-4.8 9.6-7.3 0-.5 0-.9-.1-1.2H12z"></path></svg>
        Sign in with Google
      </button>

    </form>

    <div style="flex-grow:1;"></div>

    <div style="text-align:center;font-family:Inter,sans-serif;font-size:13px;color:#767C99;">
      New to iSuites? <a href="#" style="font-weight:600;">Contact your property admin</a>
    </div>

  </div>
</div>
</body>
</html>
