<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --coral:#E85D4E; --coral-soft:#FDECE9;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
  --purple:#7C5CD6;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);}
.navbar{height:64px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;box-sizing:border-box;flex-shrink:0;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:Inter,sans-serif;font-weight:600;font-size:10.5px;color:var(--text-faint);}
.navitem.active{color:var(--navy);}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:52px 20px 16px 20px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
    <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;color:var(--navy-ink);">Notifications</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-5-5a2 2 0 0 1 0-2.8L14.2 3a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L12 20"/><path d="M9 12l6 6"/></svg>
  </div>

  <div style="display:flex;padding:0 20px;gap:26px;border-bottom:1px solid var(--border);flex-shrink:0;">
    <div style="padding:10px 0;font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:var(--navy);border-bottom:2.5px solid var(--navy);">Reservation</div>
    <div style="padding:10px 0;font-family:Inter,sans-serif;font-weight:600;font-size:14px;color:var(--text-faint);">System</div>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-bottom:60px;">
    <div style="width:120px;height:120px;border-radius:50%;background:var(--coral-soft);display:flex;align-items:center;justify-content:center;position:relative;">
      <svg width="30" height="30" viewBox="0 0 24 24" style="position:absolute;top:6px;right:6px;opacity:0.55;"><circle cx="4" cy="4" r="2" fill="var(--purple)"></circle><circle cx="14" cy="1" r="1.4" fill="var(--navy)"></circle></svg>
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;color:var(--navy-ink);">You're all caught up</span>
      <span style="font-family:Inter,sans-serif;font-size:13px;color:var(--text-muted);">Reservation alerts will appear here</span>
    </div>
  </div>

  <div class="navbar">
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-4h5v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9"/></svg><span>Home</span></div>
    <div class="navitem active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 4V6a1 1 0 0 1 1-1z"/></svg><span>Inbox</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg><span>Calendar</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg><span>Statistics</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></div>
  </div>

</div>
</body>
</html>
