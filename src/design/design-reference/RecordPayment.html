<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record Payment</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
  --coral:#E85D4E;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--surface);}
input::placeholder{color:var(--text-faint);}
.section-label{font-family:Inter,sans-serif;font-weight:700;font-size:11px;color:var(--text-faint);letter-spacing:0.6px;}
.pmethod{display:flex;align-items:center;gap:9px;padding:12px;border-radius:12px;box-sizing:border-box;}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-shrink:0;padding:52px 20px 16px 20px;box-sizing:border-box;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border);">
    <div>
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px;color:var(--navy-ink);">Record payment</div>
      <div style="font-family:Inter,sans-serif;font-size:12.5px;color:var(--text-muted);margin-top:4px;">Mrs Lubowi Lubowitz · Room 123</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>

  <div style="flex-grow:1;overflow-y:auto;padding:20px 20px 24px 20px;box-sizing:border-box;">

    <div style="background:var(--bg);border-radius:14px;padding:16px 18px;">
      <div style="font-family:Inter,sans-serif;font-weight:600;font-size:12px;color:var(--text-muted);">Current balance due</div>
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;color:var(--coral);margin-top:4px;">NGN 16,475</div>
    </div>

    <div style="margin-top:22px;">
      <span class="section-label">AMOUNT</span>
      <div style="margin-top:8px;display:flex;align-items:center;border:1px solid var(--border);border-radius:11px;padding:0 14px;height:48px;">
        <span style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:var(--text-muted);">NGN</span>
        <input placeholder="0.00" style="border:none;outline:none;flex-grow:1;height:100%;padding-left:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:16px;color:var(--navy-ink);">
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;">
        <div style="flex:1;height:40px;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;">
          <span style="font-family:Inter,sans-serif;font-weight:700;font-size:13px;color:var(--navy);">Half</span>
        </div>
        <div style="flex:1;height:40px;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;">
          <span style="font-family:Inter,sans-serif;font-weight:700;font-size:13px;color:var(--navy);">Full balance</span>
        </div>
      </div>
    </div>

    <div style="margin-top:22px;">
      <span class="section-label">PAYMENT METHOD</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
        <div class="pmethod" style="border:1.4px solid var(--border);">
          <div style="width:28px;height:28px;border-radius:8px;background:var(--navy-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
          </div>
          <span style="font-family:Inter,sans-serif;font-weight:700;font-size:13px;color:var(--navy-ink);">POS</span>
        </div>
        <div class="pmethod" style="border:1.6px solid var(--navy);background:var(--navy-soft);">
          <div style="width:28px;height:28px;border-radius:8px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/></svg>
          </div>
          <span style="font-family:Inter,sans-serif;font-weight:700;font-size:13px;color:var(--navy);">Cash</span>
        </div>
        <div class="pmethod" style="border:1.4px solid var(--border);">
          <div style="width:28px;height:28px;border-radius:8px;background:var(--navy-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          </div>
          <span style="font-family:Inter,sans-serif;font-weight:700;font-size:13px;color:var(--navy-ink);">Online</span>
        </div>
        <div class="pmethod" style="border:1.4px solid var(--border);">
          <div style="width:28px;height:28px;border-radius:8px;background:var(--navy-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>
          </div>
          <span style="font-family:Inter,sans-serif;font-weight:700;font-size:13px;color:var(--navy-ink);">Bank transfer</span>
        </div>
      </div>
    </div>

    <div style="margin-top:22px;">
      <span class="section-label">REFERENCE <span style="color:var(--text-faint);font-weight:500;text-transform:none;letter-spacing:0;">optional</span></span>
      <input placeholder="e.g. transaction ID or receipt no." style="margin-top:8px;width:100%;height:46px;box-sizing:border-box;padding:0 14px;border:1px solid var(--border);border-radius:11px;font-family:Inter,sans-serif;font-size:13.5px;color:var(--text);">
    </div>

    <div style="margin-top:18px;">
      <span class="section-label">NOTE <span style="color:var(--text-faint);font-weight:500;text-transform:none;letter-spacing:0;">optional</span></span>
      <div style="margin-top:8px;width:100%;height:72px;box-sizing:border-box;padding:12px 14px;border:1px solid var(--border);border-radius:11px;">
        <span style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--text-faint);">Any other details</span>
      </div>
    </div>

  </div>

  <div style="flex-shrink:0;display:flex;gap:10px;padding:14px 20px 28px 20px;box-sizing:border-box;border-top:1px solid var(--border);">
    <div style="flex:1;height:48px;border:1px solid var(--border);border-radius:11px;display:flex;align-items:center;justify-content:center;">
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:var(--navy-ink);">Cancel</span>
    </div>
    <div style="flex:1.4;height:48px;background:var(--navy-soft);border-radius:11px;display:flex;align-items:center;justify-content:center;">
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:var(--text-faint);">Record payment</span>
    </div>
  </div>

</div>
</body>
</html>
