<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reservation – Charges</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
  --amber:#C97F04; --amber-soft:#FBF0D9;
  --success:#1E9E6B; --success-soft:#E4F8EF;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--surface);}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.field-label{font-family:Inter,sans-serif;font-weight:700;font-size:10px;color:var(--text-faint);letter-spacing:0.5px;}
.section-label{font-family:Inter,sans-serif;font-weight:700;font-size:11px;color:var(--text-faint);letter-spacing:0.6px;}
.seg{flex:1;text-align:center;padding:8px 0;border-radius:9px;font-family:Inter,sans-serif;font-weight:700;font-size:12.5px;}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-shrink:0;">
    <div style="padding:52px 20px 0 20px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <div style="display:flex;gap:8px;">
        <div class="iconbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
        <div class="iconbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="1.8"><circle cx="5" cy="12" r="1.6" fill="var(--text)" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="var(--text)" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="var(--text)" stroke="none"/></svg></div>
      </div>
    </div>

    <div style="padding:16px 20px 0 20px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0;">
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;color:var(--navy-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Mr Kian Wilkinson</span>
        <span style="font-family:Inter,sans-serif;font-size:12.5px;color:var(--text-muted);">Room 604 · Arrived 21 Sep</span>
      </div>
      <span style="flex-shrink:0;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:5px 12px;font-family:Inter,sans-serif;font-weight:700;font-size:10.5px;">RESERVED</span>
    </div>

    <div style="display:flex;background:var(--bg);border-radius:11px;padding:4px;margin:18px 20px 0 20px;">
      <div class="seg" style="color:var(--text-muted);">Guest Info</div>
      <div class="seg" style="background:var(--navy);color:#FFFFFF;">Charges</div>
      <div class="seg" style="color:var(--text-muted);">Others</div>
    </div>
  </div>

  <div style="flex-grow:1;overflow-y:auto;padding:22px 20px 24px 20px;box-sizing:border-box;">

    <div style="background:linear-gradient(135deg,#3E52A3 0%, var(--navy) 100%);border-radius:18px;padding:20px;box-sizing:border-box;position:relative;overflow:hidden;">
      <svg width="120" height="120" viewBox="0 0 120 120" style="position:absolute;top:-40px;right:-30px;opacity:0.22;"><circle cx="60" cy="60" r="60" fill="#5A6BC0"></circle></svg>
      <div style="display:flex;align-items:center;justify-content:space-between;position:relative;">
        <span style="font-family:Inter,sans-serif;font-weight:600;font-size:12px;color:#C4CBEE;">Outstanding balance</span>
        <span style="background:var(--success);border-radius:999px;padding:4px 11px;display:flex;align-items:center;gap:5px;">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <span style="font-family:Inter,sans-serif;font-weight:800;font-size:9.5px;color:#FFFFFF;">FULLY PAID</span>
        </span>
      </div>
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:32px;color:#FFFFFF;margin-top:8px;position:relative;">NGN 0</div>

      <div style="display:flex;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.16);position:relative;">
        <div style="flex:1;">
          <div style="font-family:Inter,sans-serif;font-size:11px;color:#B9C0E8;">Charged</div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;color:#FFFFFF;margin-top:2px;">NGN 0</div>
        </div>
        <div style="width:1px;background:rgba(255,255,255,0.16);"></div>
        <div style="flex:1;text-align:right;">
          <div style="font-family:Inter,sans-serif;font-size:11px;color:#B9C0E8;">Paid</div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;color:#FFFFFF;margin-top:2px;">NGN 0</div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:14px;">
      <div style="flex:1;height:46px;border-radius:11px;background:var(--navy);display:flex;align-items:center;justify-content:center;gap:7px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span style="font-family:Inter,sans-serif;font-weight:700;font-size:13px;color:#FFFFFF;">Add charge</span>
      </div>
      <div style="flex:1;height:46px;border-radius:11px;background:var(--success-soft);border:1.4px solid var(--success);display:flex;align-items:center;justify-content:center;gap:7px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22"/><path d="M17 5.5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H7"/></svg>
        <span style="font-family:Inter,sans-serif;font-weight:700;font-size:13px;color:var(--success);">Record payment</span>
      </div>
    </div>

    <div style="margin-top:24px;">
      <span class="section-label">FOLIO</span>
      <div style="margin-top:10px;border:1px solid var(--border);border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2.5-1.6L13 21l-1-1.6L11 21l-2.5-1.6L6 21z"/><path d="M9 8h6M9 12h6"/></svg>
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13.5px;color:var(--navy-ink);">No charges yet</span>
        <span style="font-family:Inter,sans-serif;font-size:12px;color:var(--text-muted);line-height:1.5;">Add a charge or record a payment to start this guest's folio.</span>
      </div>
    </div>

  </div>

  <div style="flex-shrink:0;padding:14px 20px 28px 20px;box-sizing:border-box;border-top:1px solid var(--border);">
    <div style="height:48px;border-radius:11px;border:1.4px solid var(--navy);display:flex;align-items:center;justify-content:center;gap:8px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-3.7M8.6 13.4l6.8 3.7"/></svg>
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:var(--navy);">Share invoice</span>
    </div>
  </div>

</div>
</body>
</html>
