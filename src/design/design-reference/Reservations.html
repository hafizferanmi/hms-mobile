<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reservations</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --coral:#E85D4E; --coral-soft:#FDECE9;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
  --amber:#C97F04; --amber-soft:#FBF0D9;
  --purple:#7C5CD6; --purple-soft:#F1ECFB;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);}
input::placeholder{color:var(--text-faint);}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:52px 20px 14px 20px;box-sizing:border-box;display:flex;align-items:center;gap:12px;flex-shrink:0;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div style="flex-grow:1;position:relative;display:flex;align-items:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:12px;"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input placeholder="Search guest, res no." style="width:100%;height:40px;box-sizing:border-box;padding:0 12px 0 36px;border:1px solid var(--border);border-radius:11px;background:var(--bg);font-family:Inter,sans-serif;font-size:14px;color:var(--text);">
    </div>
    <div style="width:40px;height:40px;border-radius:11px;background:var(--navy-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg>
    </div>
  </div>

  <div style="display:flex;padding:0 20px;gap:22px;border-bottom:1px solid var(--border);flex-shrink:0;">
    <div style="padding:10px 0;font-family:Inter,sans-serif;font-weight:600;font-size:13.5px;color:var(--text-faint);">Arrivals <span style="color:var(--text-faint);">(0)</span></div>
    <div style="padding:10px 0;font-family:Inter,sans-serif;font-weight:700;font-size:13.5px;color:var(--navy);border-bottom:2.5px solid var(--navy);">Arrived <span>(0)</span></div>
    <div style="padding:10px 0;font-family:Inter,sans-serif;font-weight:600;font-size:13.5px;color:var(--text-faint);white-space:nowrap;">Departures <span>(0)</span></div>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-bottom:60px;">
    <div style="width:120px;height:120px;border-radius:50%;background:var(--navy-soft);display:flex;align-items:center;justify-content:center;position:relative;">
      <svg width="30" height="30" viewBox="0 0 24 24" style="position:absolute;top:6px;right:6px;opacity:0.5;"><circle cx="4" cy="4" r="2" fill="var(--purple)"></circle><circle cx="14" cy="1" r="1.4" fill="var(--coral)"></circle></svg>
      <svg width="58" height="50" viewBox="0 0 58 50">
        <path d="M4 12h22l6 8h22a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3z" fill="#FFFFFF" stroke="var(--navy)" stroke-width="1.5"></path>
        <path d="M1 15h56" stroke="var(--navy)" stroke-width="1.5"></path>
        <circle cx="21" cy="32" r="2" fill="var(--navy-ink)"></circle>
        <circle cx="35" cy="32" r="2" fill="var(--navy-ink)"></circle>
        <path d="M22 40h12" stroke="var(--navy-ink)" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;color:var(--navy-ink);">No reservations yet</span>
      <span style="font-family:Inter,sans-serif;font-size:13px;color:var(--text-muted);">Arrived guests will show up here</span>
    </div>
  </div>

</div>
</body>
</html>
