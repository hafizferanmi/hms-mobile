<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --coral:#E85D4E; --coral-soft:#FDECE9;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
  --amber:#C97F04;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);}
.navbar{height:64px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;box-sizing:border-box;flex-shrink:0;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:Inter,sans-serif;font-weight:600;font-size:10.5px;color:var(--text-faint);}
.navitem.active{color:var(--navy);}
.row{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;}
.rowlabel{font-family:Inter,sans-serif;font-weight:600;font-size:14.5px;color:var(--text);}
.divider{height:1px;background:var(--border);margin:0 16px;}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;overflow-y:auto;padding:56px 20px 20px 20px;box-sizing:border-box;">

    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--navy-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="var(--navy)"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15.5px;color:var(--navy-ink);">boda.afisi@gmail.com</span>
        <span style="font-family:Inter,sans-serif;font-size:12.5px;color:var(--text-muted);">boda.afisi@gmail.com</span>
      </div>
    </div>

    <div style="margin-top:20px;background:linear-gradient(135deg,#3E52A3 0%, var(--navy) 100%);border-radius:18px;padding:18px 18px;box-sizing:border-box;position:relative;overflow:hidden;">
      <svg width="120" height="120" viewBox="0 0 120 120" style="position:absolute;bottom:-40px;right:-30px;opacity:0.25;"><circle cx="60" cy="60" r="60" fill="#5A6BC0"></circle></svg>
      <div style="display:flex;align-items:center;justify-content:space-between;position:relative;">
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14.5px;color:#FFFFFF;">Current Property</span>
        <div style="display:flex;align-items:center;gap:4px;">
          <span style="font-family:Inter,sans-serif;font-weight:600;font-size:12.5px;color:#D6DBF5;">Switch Property</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#D6DBF5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:12px;position:relative;">
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px;color:#FFFFFF;">Nutsh</span>
        <span style="background:rgba(255,255,255,0.18);border-radius:6px;padding:2px 7px;font-family:Inter,sans-serif;font-weight:700;font-size:10.5px;color:#FFFFFF;">FREE</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;position:relative;">
        <span style="font-family:Inter,sans-serif;font-size:12.5px;color:#C4CBEE;">Permanently Valid</span>
        <div style="background:rgba(255,255,255,0.16);border-radius:9px;padding:7px 16px;font-family:Inter,sans-serif;font-weight:700;font-size:12.5px;color:#FFFFFF;">Upgrade</div>
      </div>
    </div>

    <div style="margin-top:20px;background:var(--surface);border-radius:18px;overflow:hidden;">
      <div class="row"><span class="rowlabel">Rate Plan</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
      <div class="divider"></div>
      <div class="row"><span class="rowlabel">Room Type</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
      <div class="divider"></div>
      <div class="row"><span class="rowlabel">Hourly Room</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
      <div class="divider"></div>
      <div class="row"><span class="rowlabel">Combined Room</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
      <div class="divider"></div>
      <div class="row"><span class="rowlabel">Property Info</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
    </div>

    <div style="margin-top:14px;background:var(--surface);border-radius:18px;overflow:hidden;">
      <div class="row"><span class="rowlabel">Accounts</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
    </div>

    <div style="margin-top:14px;background:var(--surface);border-radius:18px;overflow:hidden;">
      <div class="row"><span class="rowlabel">Language</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-family:Inter,sans-serif;font-size:13px;color:var(--text-muted);">English</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
    </div>

    <div style="margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:var(--coral);">Log Out</span>
    </div>

  </div>

  <div class="navbar">
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-4h5v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9"/></svg><span>Home</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 4V6a1 1 0 0 1 1-1z"/></svg><span>Inbox</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg><span>Calendar</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg><span>Statistics</span></div>
    <div class="navitem active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></div>
  </div>

</div>
</body>
</html>
