<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splash</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
body{margin:0;font-family:Inter,sans-serif;background:#1E2A5E}
@keyframes elen-pulse{0%,80%,100%{opacity:0.35;transform:scale(0.85);}40%{opacity:1;transform:scale(1);}}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1E2A5E;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;">

  <svg width="260" height="260" viewBox="0 0 260 260" style="position:absolute;top:-90px;left:-90px;opacity:0.5;">
    <circle cx="130" cy="130" r="130" fill="#2B3A78"></circle>
    <circle cx="130" cy="130" r="112" fill="none" stroke="#E85D4E" stroke-width="10" opacity="0.55"></circle>
  </svg>
  <svg width="180" height="180" viewBox="0 0 180 180" style="position:absolute;bottom:-60px;right:-60px;opacity:0.45;">
    <circle cx="90" cy="90" r="90" fill="#2B3A78"></circle>
    <circle cx="90" cy="90" r="76" fill="none" stroke="#7C93FF" stroke-width="9" opacity="0.6"></circle>
  </svg>

  <div style="display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;">
    <svg width="46" height="35" viewBox="0 0 22 17">
      <rect x="0" y="7" width="5" height="10" rx="1" fill="#E85D4E"></rect>
      <rect x="8.5" y="2" width="5" height="15" rx="1" fill="#F0B429"></rect>
      <rect x="17" y="9" width="5" height="8" rx="1" fill="#7C93FF"></rect>
    </svg>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:38px;color:#FFFFFF;letter-spacing:-0.5px;">iSuites</span>
      <span style="font-family:Inter,sans-serif;font-weight:500;font-size:14px;color:#B9C0E8;letter-spacing:0.2px;">Property management, simplified</span>
    </div>
  </div>

  <div style="position:absolute;bottom:64px;display:flex;gap:8px;">
    <span style="width:8px;height:8px;border-radius:50%;background:#FFFFFF;display:block;animation:elen-pulse 1.2s ease-in-out infinite;animation-delay:0s;"></span>
    <span style="width:8px;height:8px;border-radius:50%;background:#FFFFFF;display:block;animation:elen-pulse 1.2s ease-in-out infinite;animation-delay:0.15s;"></span>
    <span style="width:8px;height:8px;border-radius:50%;background:#FFFFFF;display:block;animation:elen-pulse 1.2s ease-in-out infinite;animation-delay:0.3s;"></span>
  </div>

</div>
</body>
</html>
