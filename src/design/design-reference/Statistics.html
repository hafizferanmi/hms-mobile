<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Statistics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --coral:#E85D4E; --coral-soft:#FDECE9;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
  --success:#1E9E6B; --success-soft:#E4F8EF;
  --amber:#C97F04; --amber-soft:#FBF0D9;
  --purple:#7C5CD6; --purple-soft:#F1ECFB;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);}
.navbar{height:64px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;box-sizing:border-box;flex-shrink:0;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:Inter,sans-serif;font-weight:600;font-size:10.5px;color:var(--text-faint);}
.navitem.active{color:var(--navy);}
.st-tile{display:flex;flex-direction:column;align-items:center;gap:9px;}
.st-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
.st-label{font-family:Inter,sans-serif;font-weight:600;font-size:12px;color:var(--text);}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:52px 20px 20px 20px;box-sizing:border-box;flex-shrink:0;text-align:center;">
    <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;color:var(--navy-ink);">Statistics</span>
  </div>

  <div style="flex-grow:1;overflow-y:auto;padding:0 20px 20px 20px;box-sizing:border-box;">

    <div style="background:var(--surface);border-radius:18px;padding:26px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;row-gap:26px;">
      <div class="st-tile">
        <div class="st-icon" style="background:var(--amber-soft);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v6h-6"/></svg>
        </div>
        <span class="st-label">Revenue</span>
      </div>
      <div class="st-tile">
        <div class="st-icon" style="background:var(--navy-soft);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
        </div>
        <span class="st-label">Transactions</span>
      </div>
      <div class="st-tile">
        <div class="st-icon" style="background:var(--purple-soft);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.7 10.7l6.6-3.4M8.7 13.3l6.6 3.4"/></svg>
        </div>
        <span class="st-label">Channel</span>
      </div>
      <div class="st-tile">
        <div class="st-icon" style="background:var(--coral-soft);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12z"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
        </div>
        <span class="st-label">Sales Revenue</span>
      </div>
      <div class="st-tile">
        <div class="st-icon" style="background:var(--navy-soft);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 9-9"/></svg>
        </div>
        <span class="st-label">Metrics</span>
      </div>
      <div class="st-tile">
        <div class="st-icon" style="background:var(--success-soft);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </div>
        <span class="st-label">Quick Note</span>
      </div>
    </div>

    <div style="margin-top:18px;background:var(--surface);border-radius:18px;padding:18px 18px;display:flex;flex-direction:column;gap:14px;">
      <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14.5px;color:var(--navy-ink);">This week</span>
      <div style="display:flex;align-items:flex-end;gap:8px;height:80px;">
        <div style="flex:1;background:var(--navy-soft);border-radius:6px 6px 0 0;height:35%;"></div>
        <div style="flex:1;background:var(--navy-soft);border-radius:6px 6px 0 0;height:55%;"></div>
        <div style="flex:1;background:var(--navy);border-radius:6px 6px 0 0;height:90%;"></div>
        <div style="flex:1;background:var(--navy-soft);border-radius:6px 6px 0 0;height:42%;"></div>
        <div style="flex:1;background:var(--navy-soft);border-radius:6px 6px 0 0;height:66%;"></div>
        <div style="flex:1;background:var(--navy-soft);border-radius:6px 6px 0 0;height:28%;"></div>
        <div style="flex:1;background:var(--navy-soft);border-radius:6px 6px 0 0;height:48%;"></div>
      </div>
    </div>

  </div>

  <div class="navbar">
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-4h5v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9"/></svg><span>Home</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 4V6a1 1 0 0 1 1-1z"/></svg><span>Inbox</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg><span>Calendar</span></div>
    <div class="navitem active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg><span>Statistics</span></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></div>
  </div>

</div>
</body>
</html>
