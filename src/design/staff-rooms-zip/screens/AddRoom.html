<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add Room</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--surface);}
input::placeholder{color:var(--text-faint);}
.field-label{font-family:Inter,sans-serif;font-weight:700;font-size:10px;color:var(--text-faint);letter-spacing:0.5px;}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-shrink:0;padding:52px 20px 16px 20px;box-sizing:border-box;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border);">
    <div style="display:flex;gap:12px;align-items:flex-start;">
      <div style="width:36px;height:36px;border-radius:10px;background:var(--navy-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/></svg>
      </div>
      <div>
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px;color:var(--navy-ink);">Add room</div>
        <div style="font-family:Inter,sans-serif;font-size:12px;color:var(--text-muted);margin-top:3px;">Add a physical room to an existing room type</div>
      </div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px;"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>

  <div style="flex-grow:1;overflow-y:auto;padding:20px 20px 24px 20px;box-sizing:border-box;">

    <div style="display:flex;align-items:center;gap:8px;background:var(--navy-soft);border-radius:11px;padding:12px 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18h18M5 10V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4"/></svg>
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:13.5px;color:var(--navy);">Adding to <b>Royal Suite</b></span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;"><path d="M6 9l6 6 6-6"/></svg>
    </div>

    <div style="margin-top:20px;">
      <span class="field-label">ROOM NUMBER</span>
      <input placeholder="e.g. 12B or 101, 102, 103" style="margin-top:8px;width:100%;height:46px;box-sizing:border-box;padding:0 14px;border:1.6px solid var(--navy);border-radius:11px;font-family:Inter,sans-serif;font-size:14px;color:var(--text);">
      <div style="font-family:Inter,sans-serif;font-size:11px;color:var(--text-faint);margin-top:6px;">Separate with commas to add several rooms at once</div>
    </div>

    <div style="margin-top:18px;">
      <span class="field-label">DESCRIPTION <span style="color:var(--text-faint);font-weight:500;text-transform:none;letter-spacing:0;">optional</span></span>
      <div style="margin-top:8px;width:100%;height:80px;box-sizing:border-box;padding:12px 14px;border:1px solid var(--border);border-radius:11px;">
        <span style="font-family:Inter,sans-serif;font-size:13.5px;color:var(--text-faint);">Anything staff should know about this specific room</span>
      </div>
    </div>

  </div>

  <div style="flex-shrink:0;display:flex;gap:10px;padding:14px 20px 28px 20px;box-sizing:border-box;border-top:1px solid var(--border);">
    <div style="flex:1;height:48px;border:1px solid var(--border);border-radius:11px;display:flex;align-items:center;justify-content:center;">
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:var(--navy-ink);">Cancel</span>
    </div>
    <div style="flex:1.4;height:48px;background:var(--navy);border-radius:11px;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 8px 16px rgba(30,42,94,0.24);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:#FFFFFF;">Add room</span>
    </div>
  </div>

</div>
</body>
</html>
