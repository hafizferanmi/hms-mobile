<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room Type Detail</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --coral:#E85D4E; --coral-soft:#FDECE9;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--surface);}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.field-label{font-family:Inter,sans-serif;font-weight:700;font-size:10px;color:var(--text-faint);letter-spacing:0.5px;}
.field-value{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14.5px;color:var(--navy-ink);}
.section-label{font-family:Inter,sans-serif;font-weight:700;font-size:11px;color:var(--text-faint);letter-spacing:0.6px;}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-shrink:0;padding:52px 20px 0 20px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="iconbtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="1.8"><circle cx="5" cy="12" r="1.6" fill="var(--text)" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="var(--text)" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="var(--text)" stroke="none"/></svg></div>
  </div>

  <div style="padding:16px 20px 0 20px;box-sizing:border-box;display:flex;align-items:center;gap:12px;">
    <div style="width:44px;height:44px;border-radius:12px;background:var(--navy-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18h18M5 10V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4"/></svg>
    </div>
    <div>
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;color:var(--navy-ink);">Royal Suite</div>
      <div style="font-family:Inter,sans-serif;font-size:12.5px;color:var(--text-muted);margin-top:2px;">Sleeps up to 3 guests</div>
    </div>
  </div>

  <div style="flex-grow:1;overflow-y:auto;padding:22px 20px 24px 20px;box-sizing:border-box;">

    <div style="display:flex;background:var(--bg);border-radius:16px;overflow:hidden;">
      <div style="flex:1;padding:14px 0;text-align:center;border-right:1px solid var(--border);">
        <div class="field-label">ROOMS</div>
        <div class="field-value" style="margin-top:4px;">4</div>
      </div>
      <div style="flex:1.3;padding:14px 0;text-align:center;border-right:1px solid var(--border);">
        <div class="field-label">SLEEPS UP TO</div>
        <div class="field-value" style="margin-top:4px;font-size:13px;">3 guests</div>
      </div>
      <div style="flex:1;padding:14px 0;text-align:center;">
        <div class="field-label">PRICING</div>
        <div class="field-value" style="margin-top:4px;">Fixed</div>
      </div>
    </div>

    <div style="margin-top:24px;">
      <span class="section-label">PRICING</span>
      <div style="margin-top:10px;background:var(--coral-soft);border-radius:14px;padding:16px 18px;display:flex;align-items:baseline;gap:6px;">
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;color:var(--coral);">NGN 40,000</span>
        <span style="font-family:Inter,sans-serif;font-size:12.5px;color:var(--text-muted);">/ night</span>
      </div>
    </div>

    <div style="margin-top:24px;display:flex;align-items:center;justify-content:space-between;">
      <span class="section-label">ROOMS OF THIS TYPE (4)</span>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;">

      <div style="border:1.4px dashed var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span style="font-family:Inter,sans-serif;font-weight:700;font-size:12px;color:var(--navy);">Add room</span>
      </div>

      <div style="border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/></svg>
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;color:var(--navy-ink);">500</span>
      </div>

      <div style="border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/></svg>
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;color:var(--navy-ink);">44</span>
      </div>

      <div style="border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/></svg>
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;color:var(--navy-ink);">123</span>
      </div>

      <div style="border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/></svg>
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;color:var(--navy-ink);">305a</span>
      </div>

    </div>

  </div>

</div>
</body>
</html>
