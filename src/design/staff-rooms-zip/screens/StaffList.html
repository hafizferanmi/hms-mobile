<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff &amp; Roles – Staff</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#1E2A5E; --navy-ink:#12173A; --navy-soft:#EEF0FA;
  --coral:#E85D4E; --coral-soft:#FDECE9;
  --bg:#F5F6FB; --surface:#FFFFFF; --border:#E7E9F3;
  --text:#1A1D29; --text-muted:#767C99; --text-faint:#A4A9C1;
  --amber:#C97F04; --amber-soft:#FBF0D9;
  --purple:#7C5CD6; --purple-soft:#F1ECFB;
}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);}
input::placeholder{color:var(--text-faint);}
.seg{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-family:Inter,sans-serif;font-weight:700;font-size:13px;}
.staffrow{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--surface);border-radius:14px;}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="flex-shrink:0;padding:52px 20px 14px 20px;box-sizing:border-box;background:var(--surface);">
    <div style="display:flex;align-items:center;gap:12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px;color:var(--navy-ink);">Staff &amp; Roles</span>
    </div>

    <div style="display:flex;background:var(--bg);border-radius:11px;padding:4px;margin-top:16px;">
      <div class="seg" style="background:var(--navy);color:#FFFFFF;">Staff</div>
      <div class="seg" style="color:var(--text-muted);">Roles</div>
    </div>
  </div>

  <div style="flex-grow:1;overflow-y:auto;">

    <div style="padding:16px 20px 0 20px;box-sizing:border-box;">
      <div style="position:relative;display:flex;align-items:center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:12px;"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input placeholder="Search staff" style="width:100%;height:42px;box-sizing:border-box;padding:0 12px 0 34px;border:1px solid var(--border);border-radius:11px;background:var(--surface);font-family:Inter,sans-serif;font-size:13px;color:var(--text);">
      </div>
    </div>

    <div style="padding:14px 20px 0 20px;box-sizing:border-box;display:flex;gap:8px;">
      <div style="flex-shrink:0;background:var(--navy-ink);color:#FFFFFF;border-radius:999px;padding:7px 14px;"><span style="font-family:Inter,sans-serif;font-weight:700;font-size:12px;">Activated</span></div>
      <div style="flex-shrink:0;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);border-radius:999px;padding:7px 14px;"><span style="font-family:Inter,sans-serif;font-weight:700;font-size:12px;">Deactivated</span></div>
    </div>

    <div style="padding:14px 20px 100px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;">

      <div class="staffrow">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:#FFFFFF;">BA</span>
        </div>
        <div style="flex-grow:1;min-width:0;">
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13.5px;color:var(--navy-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">boda.afisi@gmail.com</div>
          <div style="font-family:Inter,sans-serif;font-size:11.5px;color:var(--text-muted);margin-top:2px;">boda.afisi@gmail.com</div>
        </div>
        <span style="flex-shrink:0;background:var(--navy-soft);color:var(--navy);border-radius:999px;padding:4px 10px;font-family:Inter,sans-serif;font-weight:700;font-size:10px;">Host</span>
      </div>

      <div class="staffrow">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--coral);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:#FFFFFF;">AO</span>
        </div>
        <div style="flex-grow:1;min-width:0;">
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13.5px;color:var(--navy-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Amaka Obi</div>
          <div style="font-family:Inter,sans-serif;font-size:11.5px;color:var(--text-muted);margin-top:2px;">amaka.obi@nutsh.com</div>
        </div>
        <span style="flex-shrink:0;background:var(--coral-soft);color:var(--coral);border-radius:999px;padding:4px 10px;font-family:Inter,sans-serif;font-weight:700;font-size:10px;">Receptionist</span>
      </div>

      <div class="staffrow">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span style="font-family:Inter,sans-serif;font-weight:700;font-size:14px;color:#FFFFFF;">SA</span>
        </div>
        <div style="flex-grow:1;min-width:0;">
          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13.5px;color:var(--navy-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Segun Ade</div>
          <div style="font-family:Inter,sans-serif;font-size:11.5px;color:var(--text-muted);margin-top:2px;">segun.ade@nutsh.com</div>
        </div>
        <span style="flex-shrink:0;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:4px 10px;font-family:Inter,sans-serif;font-weight:700;font-size:10px;">Housekeeper</span>
      </div>

    </div>

  </div>

  <div style="position:absolute;right:18px;bottom:24px;height:52px;padding:0 20px 0 18px;border-radius:26px;background:var(--navy);display:flex;align-items:center;gap:8px;box-shadow:0 12px 22px rgba(30,42,94,0.35);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    <span style="font-family:Inter,sans-serif;font-weight:700;font-size:13.5px;color:#FFFFFF;">Add staff</span>
  </div>

</div>
</body>
</html>
